# Warms the remote cache the moment a production deploy goes live.
#
# The daily Vercel Cron (vercel.json) can't fire on a deploy, so without this
# the first visitors after shipping pay the upstream's 2–3s per cold read.
# Vercel's GitHub integration reports each deployment back as a
# deployment_status event; on a successful production one, this calls
# /api/warm with the same bearer token the cron uses.
#
# It calls the production domain, not the event's environment_url: the
# per-deployment URL sits behind Vercel Authentication, and the route warms
# the origin it was called on. Previews are skipped for the same reason.
#
# Requires the CRON_SECRET repository secret, matching the Vercel env var.
name: Warm cache after deploy

on: deployment_status

jobs:
  warm:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://vercel-swag-store-lac.vercel.app
    steps:
      - name: Warm /api/warm
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repository secret is not set"
            exit 1
          fi
          # Retries cover the moment between "Ready" and the alias pointing
          # at the new deployment.
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PRODUCTION_URL/api/warm" | tee warm.json
          echo
          # The route answers 200 even if a page it fetched failed; fail the
          # job if any warmed path did.
          jq -e 'all(.results[]; .status == 200)' warm.json > /dev/null \
            || { echo "::error::a warmed path did not return 200"; exit 1; }
